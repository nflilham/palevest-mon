<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background sky & grass -->
  <rect width="16" height="16" rx="2" fill="#2c1e16"/>
  <rect x="1" y="1" width="14" height="10" fill="#7ec8e3"/>
  <rect x="1" y="11" width="14" height="4" fill="#5da142"/>
  <rect x="1" y="13" width="14" height="2" fill="#468232"/>
  <!-- Sun -->
  <rect x="2" y="2" width="2" height="2" fill="#fde047"/>
  <!-- Chimney -->
  <rect x="11" y="3" width="2" height="3" fill="#6e473b"/>
  <rect x="12" y="1" width="1" height="1" fill="#f3f4f6"/>
  <!-- Roof (16x16 pitched pixel roof) -->
  <rect x="6" y="3" width="4" height="1" fill="#9e3b24"/>
  <rect x="5" y="4" width="6" height="1" fill="#b84a32"/>
  <rect x="4" y="5" width="8" height="1" fill="#cf5c42"/>
  <rect x="3" y="6" width="10" height="1" fill="#9e3b24"/>
  <!-- Cottage walls -->
  <rect x="4" y="7" width="8" height="5" fill="#f5e6c8"/>
  <rect x="4" y="7" width="1" height="5" fill="#7c4d2b"/>
  <rect x="11" y="7" width="1" height="5" fill="#7c4d2b"/>
  <!-- Door & window -->
  <rect x="6" y="9" width="2" height="3" fill="#7c4d2b"/>
  <rect x="7" y="10" width="1" height="1" fill="#fbbf24"/>
  <rect x="9" y="8" width="2" height="2" fill="#fde047"/>
  <!-- Sprout on left -->
  <rect x="2" y="10" width="1" height="2" fill="#3b7a3e"/>
  <rect x="1" y="9" width="1" height="1" fill="#78c257"/>
  <rect x="3" y="9" width="1" height="1" fill="#78c257"/>
</svg>
